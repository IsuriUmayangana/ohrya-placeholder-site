version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run fetch:instagram || echo "Instagram fetch skipped (set IG_USER_ID and IG_ACCESS_TOKEN in Amplify env)"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
